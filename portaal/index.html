<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#100d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Villa Amano">
<title>Mijn Villa Amano</title>
<script src="/lib/qrcode.js" defer></script>
<link rel="manifest" href="/portaal/manifest.webmanifest">
<link rel="apple-touch-icon" href="/portaal/icon-192.png">
<link rel="icon" href="/portaal/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&family=Wittgenstein&display=swap" rel="stylesheet">
<style>
:root{--bg:#16120f;--line:#ffffff1a;--beige:#E8D8B8;--gold:#e6b866;--gold2:#f6dfa4;--text:#efe6d6;--muted:#a99b88;--green:#9fc7a8;--red:#e8a0a0;
--serif:'Cormorant Garamond',Georgia,serif;--caps:'Wittgenstein',Georgia,serif;--sans:'Jost',Arial,sans-serif;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:300 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;background:radial-gradient(ellipse 90% 30% at 50% 0%,#2a2018,transparent 70%),var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;line-height:1.1}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.caps{font-family:var(--caps);text-transform:uppercase;letter-spacing:.32em;font-size:10px;color:var(--gold)}
.k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}
/* auth */
#auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(30px + var(--st)) 22px 30px;max-width:440px;margin:auto}
#auth .lg{height:60px;align-self:center;margin-bottom:16px}
#auth h1{font-size:36px;text-align:center;margin:6px 0 4px}
#auth p{color:var(--muted);text-align:center;margin:0 0 22px;font-size:14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea{height:52px;border-radius:16px;border:1px solid var(--line);background:#120f0d;padding:0 16px;font-size:16px;outline:none;width:100%}
.f textarea{height:auto;min-height:90px;padding:12px 16px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border:0;border-radius:999px;font:500 15px var(--sans);color:#24180e;background:linear-gradient(120deg,#f6dfa4,#e6b866 55%,#c98d3e);box-shadow:0 10px 30px #e6b86633;white-space:nowrap}
.cta:disabled{filter:grayscale(.7) brightness(.6)}.cta.full{width:100%}.cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid #e8d8b84d;background:transparent;font-size:14px;white-space:nowrap}
.b2.red{border-color:#e8a0a066;color:var(--red)}
.sw{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}.sw button{background:none;border:0;color:var(--gold2);text-decoration:underline}
.or{display:flex;align-items:center;gap:12px;margin:16px 0 14px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.or:before,.or:after{content:'';flex:1;height:1px;background:#ffffff1f}
.err{color:#f3c0c0;font-size:13.5px;margin-bottom:10px}.err:empty{display:none}
/* shell */
#app{padding:calc(70px + var(--st)) 16px calc(100px + var(--sb));max-width:640px;margin:auto}
.top{position:fixed;inset:0 0 auto;z-index:20;padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;gap:12px;background:#100d0bd9;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #ffffff0f}
.top img{height:32px}.top h2{font-size:24px;flex:1}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(120deg,#f6dfa4,#c98d3e);color:#24180e;font:500 14px var(--sans);border:0}
.tabs{position:fixed;inset:auto 0 0;z-index:20;display:flex;padding:8px 4px calc(8px + var(--sb));background:#100d0bf0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #ffffff12}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 0;font-size:10.5px;color:var(--muted)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold2)}
/* blocks */
.hello{margin:6px 2px 18px}.hello h1{font-size:34px}.hello p{margin:2px 0 0;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#ffffff0b,#ffffff03);padding:16px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px}.sec h3{font-size:22px}.sec a,.sec button{font-size:12.5px;color:var(--gold2);background:none;border:0}
.back{height:36px;font-size:13px;margin-bottom:12px}
.ok{border:1px solid #9fc7a866;background:#9fc7a814;border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;font-size:14px}
.ok svg{width:22px;height:22px;stroke:var(--green);fill:none;stroke-width:1.6;flex:none}
.stay{position:relative;border-radius:26px;overflow:hidden;border:1px solid color-mix(in srgb,var(--t) 45%,#ffffff1a);margin-bottom:12px;background:#1a1512}
.stay .im{height:150px;background-size:cover;background-position:center;position:relative}
.stay .im:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#1a1512 0%,transparent 60%)}
.stay .badge{position:absolute;z-index:2;top:12px;left:12px;padding:6px 12px;border-radius:999px;background:#0d0a08a6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff33;font-size:12px}
.stay .bd{padding:4px 18px 18px;margin-top:-34px;position:relative;z-index:2}
.stay h2{font-size:34px}.stay .dt{color:#d6cab7;font-size:14px;margin:2px 0 14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ffffff14;border-bottom:1px solid #ffffff14;padding:12px 0;margin-bottom:14px;text-align:center}
.facts b{display:block;font:400 20px var(--serif)}.facts span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .cta{flex:1}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #ffffff0d}.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#ffffff0a;flex:none}
.row .ic svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-weight:400}.row .tx small{color:var(--muted);font-size:12.5px;display:block}
.row .rt{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;border:1px solid var(--line)}
.pill.g{border-color:#9fc7a866;color:var(--green)}.pill.y{border-color:#e6b86680;color:var(--gold2)}.pill.r{border-color:#e8a0a066;color:var(--red)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:1px solid var(--line);display:block}
.tile .im{position:absolute;inset:0;background-size:cover;background-position:center}
.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0d0a08e6,transparent 65%)}
.tile b{position:absolute;z-index:2;left:12px;bottom:10px;right:10px;font:400 18px/1.15 var(--serif)}
.hs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.ic2{margin:-2px -16px 4px}.ic2>*{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#ffffff06;font-size:12.5px;color:#d6cab7;white-space:nowrap}.ic2 svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.4}.ic2 a{color:var(--gold2);border-color:#e6b86655}
.evc{flex:none;width:208px;scroll-snap-align:start;display:flex;gap:10px;align-items:center;padding:10px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c,#e6b866) 35%,#ffffff14);background:linear-gradient(150deg,color-mix(in srgb,var(--c,#e6b866) 12%,transparent),#ffffff05);text-align:left}
.evc.sk{height:62px;background:#ffffff08;border-color:#ffffff0d}
.evc .dd{width:42px;height:42px;border-radius:12px;background:#0d0a0899;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:none;line-height:1.1}.evc .dd b{font:400 18px var(--serif);color:var(--c);letter-spacing:0}
.evc .et{min-width:0}.evc .et b{display:block;font-weight:400;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evc .et small{color:var(--muted);font-size:11.5px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{display:flex;gap:9px;align-items:center;padding:8px;border-radius:16px;border:1px solid var(--line);background:#ffffff06}.mini .th{width:40px;height:40px;border-radius:11px;background-size:cover;background-position:center;flex:none}
.mini b{display:block;font-weight:400;font-size:12.5px;line-height:1.25}.mini small{display:block;color:var(--muted);font-size:10.5px;line-height:1.3;margin-top:1px}
.nbc{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:#ffffff06;min-width:112px}.nbc span{font-size:17px}.nbc b{font-weight:400;font-size:13px;white-space:nowrap}.nbc small{color:var(--muted);font-size:11px}
.empty{color:var(--muted);text-align:center;padding:18px 10px;font-size:14px}
/* booking list */
.bk{border:1px solid color-mix(in srgb,var(--t) 40%,#ffffff1a);border-radius:22px;padding:14px;margin-bottom:10px;display:flex;gap:12px;background:linear-gradient(150deg,color-mix(in srgb,var(--t) 10%,transparent),transparent 60%)}
.bk .th{width:74px;height:74px;border-radius:16px;background-size:cover;background-position:center;flex:none}
.bk .tx{flex:1;min-width:0}.bk b{display:block;font:400 20px var(--serif)}.bk small{display:block;color:var(--muted);font-size:12.5px}
.bk .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.bk.off{opacity:.5}
/* membership */
.mcard{position:relative;border-radius:24px;padding:20px;margin-bottom:14px;overflow:hidden;background:linear-gradient(135deg,#3a2c1f,#1b1511 60%,#2a2018);border:1px solid #e6b86666;box-shadow:0 20px 50px #0008}
.mcard:before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#e6b86640,transparent 70%)}
.mcard img{height:34px;position:relative}.mcard .no{font:400 26px var(--serif);letter-spacing:.08em;margin:18px 0 2px;position:relative}
.mcard .nm{font-size:14px;color:#d6cab7;position:relative}.mcard .pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.plan{border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;background:#0000002e}
.plan .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.plan b{font:400 20px var(--serif);display:block}.plan em{font-style:normal;color:var(--gold2);font-size:14px;white-space:nowrap}
.plan p{margin:4px 0 12px;color:var(--muted);font-size:13.5px}
.grp{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}.grp i{width:9px;height:9px;border-radius:50%;background:var(--c)}.grp h3{font-size:22px}
/* discover */
.nb{display:flex;gap:12px;padding:14px 2px;border-bottom:1px solid #ffffff0d}.nb:last-child{border-bottom:0}
.nb .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#ffffff0a;flex:none;font-size:20px}
.nb .tx{flex:1;min-width:0}.nb b{display:block;font:400 19px var(--serif)}.nb small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.nb a{align-self:center;font-size:12.5px;color:var(--gold2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#ffffff08;font-size:14px}
.chips svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.3}
/* sheet */
.sbg{position:fixed;inset:0;z-index:40;background:#000a;opacity:0;pointer-events:none;transition:.3s}.sbg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;padding:12px 18px calc(22px + var(--sb));border-radius:26px 26px 0 0;background:linear-gradient(170deg,#241c16,#14100d);border:1px solid #e8d8b826;border-bottom:0;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:auto}
.sheet.open{transform:none}.sheet .grab{width:42px;height:4px;border-radius:2px;background:#ffffff33;margin:0 auto 14px}
.sheet h3{font-size:28px;margin-bottom:4px}.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.steps{margin:0 0 16px;padding-left:20px;color:#d6cab7;font-size:14px}.steps li{margin-bottom:6px}
.ist{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ffffff0d}.ist:last-of-type{border-bottom:0;margin-bottom:12px}.ist .in{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid #e6b86680;color:var(--gold2);font:400 16px var(--serif)}.ist b{display:block;font-weight:400}.ist small{color:var(--muted);font-size:13px}
.qrw{text-align:center}.qrbox{width:min(250px,70vw);aspect-ratio:1;margin:0 auto;background:#fff;border-radius:22px;padding:12px;box-shadow:0 0 0 1px #e6b86655,0 20px 60px #e6b86626}.qrbox svg{width:100%;height:100%;display:block}
.inq{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border-radius:18px;background:#0d0a0880;border:1px solid #ffffff12;cursor:pointer}
.inq-q{width:104px;height:104px;flex:none;background:#fff;border-radius:14px;padding:6px}.inq-q svg{width:100%;height:100%;display:block}
.inq-t b{display:block;font:400 17px/1.2 var(--serif);margin:4px 0 4px}.inq-t small{display:block;color:var(--green);font-size:12.5px}.inq-t small.k{color:var(--muted);margin-top:4px}
.qb{width:44px;padding:0}.qb svg,.qrt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}.qrt{display:inline-flex;align-items:center;gap:5px;color:var(--gold2);font-size:12.5px}
.mqr{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;z-index:1}.mqr svg{width:26px;height:26px;stroke:#24180e;fill:none;stroke-width:1.6}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,10px);z-index:60;padding:11px 18px;border-radius:14px;background:#2a2018;border:1px solid #e8d8b833;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:#e8a0a066;color:#f3d6d6}
.calw{border:1px solid var(--line);border-radius:24px;padding:14px;background:linear-gradient(160deg,#ffffff0b,#ffffff03)}
.calh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.calh h3{font-size:22px;text-transform:capitalize}.calh .nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;font-size:20px;color:var(--gold2)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cg.hd span{text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 0 6px}
.cd{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:#ffffff05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:inherit}
.cd b{font:400 15px var(--serif)}.cd i{display:flex;gap:3px;height:5px}.cd em{width:5px;height:5px;border-radius:50%;display:block}
.cd.past{opacity:.4}.cd.td{border-color:#e6b86680}.cd.td b{color:var(--gold2)}.cd.sel{background:#e6b86622;border-color:var(--gold)}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--muted)}.leg span{display:inline-flex;align-items:center;gap:6px}.leg em{width:7px;height:7px;border-radius:50%;display:inline-block}
.cal2{margin-top:10px}.cal2 .mini{text-align:left;color:inherit;font:inherit;cursor:pointer}
.bk-d{display:flex;gap:6px;overflow-x:auto;margin:8px -18px 0;padding:0 18px 4px;scrollbar-width:none}.bk-d::-webkit-scrollbar{display:none}
.bk-d button{flex:none;width:52px;height:60px;border-radius:14px;border:1px solid var(--line);background:#ffffff06;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.bk-d small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.bk-d b{font:400 18px var(--serif)}
.bk-t{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bk-t button{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#ffffff06;color:inherit;font-size:14px}
.bk-d button.on,.bk-t button.on{border-color:var(--gold);background:#e6b86622;color:var(--gold2)}

.sb-top,.sb-me,.sb-web{display:none}.au-art{display:none}.au-in{display:flex;flex-direction:column}
.hero0{background:linear-gradient(0deg,#16120fee,#16120f99),url('/img/villa-avond.jpg') center/cover}
@media(min-width:960px){
 body{background:radial-gradient(ellipse 60% 40% at 70% 0%,#2a2018,transparent 70%),var(--bg)}
 .tabs{inset:0 auto 0 0;width:264px;flex-direction:column;justify-content:flex-start;gap:4px;padding:30px 18px;border-top:0;border-right:1px solid #ffffff10;background:#110e0c}
 .sb-top{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:0 10px 30px;margin-bottom:10px;border-bottom:1px solid #ffffff0d}.sb-top img{height:46px;width:auto}
 .tabs button{flex:none;flex-direction:row;gap:14px;height:48px;padding:0 14px;border-radius:14px;font-size:14.5px;justify-content:flex-start;width:100%}
 .tabs button svg{width:21px;height:21px}.tabs button:hover{background:#ffffff08;color:var(--text)}
 .tabs button.on{background:linear-gradient(120deg,#e6b8661f,#e6b86608);color:var(--gold2);box-shadow:inset 0 0 0 1px #e6b86633}
 .sb-me{display:flex;gap:12px;align-items:center;margin-top:auto;padding:14px 10px;border-top:1px solid #ffffff0d}.sb-me .av{flex:none}.sb-me b{display:block;font-weight:400;font-size:14px}.sb-me small{color:var(--muted);font-size:12px}
 .sb-web{display:block;padding:6px 10px 0;font-size:12.5px;color:var(--muted)}.sb-web:hover{color:var(--gold2)}
 .top{left:264px;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:26px 48px 0;pointer-events:none}.top img{display:none}.top h2{font-size:15px;font-family:var(--caps);text-transform:uppercase;letter-spacing:.3em;color:var(--gold)}.top .av{display:none}
 #app{max-width:none;margin:0 0 0 264px;padding:70px 48px 60px}
 #app>*{max-width:1160px}
 .hello{margin:0 0 26px}.hello h1{font-size:52px}
 .hg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:start}
 .hg .hcol>.sec:first-child{margin-top:0}
 .stay .im{height:300px}.stay h2{font-size:42px}.stay .bd{padding:4px 26px 26px}
 .hs{display:grid;grid-template-columns:1fr;overflow:visible;margin:0;padding:0;gap:8px}

 .nbc{min-width:0}
 .hero0{padding:60px 30px!important}.hero0 h3{font-size:36px!important}

 .bkwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bkwrap .bk{margin:0}
 .mwrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:32px;align-items:start}.mwrap .mcard{position:sticky;top:90px}
 .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pgrid .plan{margin:0}
 .dwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}.dwrap .sec:first-child{margin-top:0}
 .awrap{max-width:720px}
 .calw{max-width:560px}.cal2{max-width:560px}#dayv{max-width:560px}
 .inq{margin-top:18px}.inq-q{width:124px;height:124px}
 .sheet{left:50%;right:auto;top:50%;bottom:auto;width:520px;max-width:calc(100vw - 40px);max-height:86vh;border-radius:26px;border-bottom:1px solid #e8d8b826;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;padding:22px 26px 26px}
 .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.sheet .grab{display:none}
 .toast{bottom:30px;left:calc(50% + 132px)}
 #auth{max-width:none;margin:0;padding:0;display:grid;grid-template-columns:1.15fr 1fr;align-items:stretch;min-height:100vh}
 .au-art{display:flex;align-items:flex-end;padding:56px;background:linear-gradient(0deg,#0d0a08f0,#0d0a0833 55%),url('/img/villa-avond.jpg') center/cover}
 .au-q h2{font-size:64px;margin:10px 0}.au-q p{color:#d6cab7;max-width:440px;font-size:16px;margin:0}
 .au-in{display:flex;flex-direction:column;justify-content:center;padding:56px;max-width:520px;width:100%;margin:auto}
}
@media(min-width:960px) and (max-width:1180px){.hg,.dwrap{grid-template-columns:1fr}.mwrap{grid-template-columns:320px 1fr}}

<script>
const R={rose:['Rose Quartz','#e8a0b0','rose-1'],clear:['Clear Quartz','#cfe3ee','clear-1'],sun:['Sunstone','#e6b866','sun-1'],moon:['Moonstone','#9fb8e6','moon-1'],amethyst:['Amethyst','#b48ce6','ame-1']};
const ADDR='Wijsstraat 1, 3740 Bilzen-Hoeselt',MAIL='info@villa-amano.be',MAPS='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Wijsstraat 1, 3740 Bilzen');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>new Date(s+'T12:00'),nice=s=>pd(s).toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short'});
const fmt=n=>'€ '+Number(n).toLocaleString('nl-BE',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
let T=null,D={},TAB='home';try{T=localStorage.getItem('va_g_t')}catch(e){}
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600)}
async function api(a,b){const r=await fetch('/api/ops?a='+a,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));
 if(r.status===401&&!/^g-(login|register)$/.test(a)){logout(1);throw new Error('Log opnieuw in')}if(!r.ok)throw Object.assign(new Error(j.error||'Er ging iets mis'),{status:r.status});return j}

/* auth */
let MODE='login';
function authMode(m){MODE=m;document.querySelectorAll('#aF .reg').forEach(x=>x.classList.toggle('hide',m!=='register'));$('#aT').textContent=m==='register'?'Maak je account':'Welkom';
 $('#aP').textContent=m==='register'?'Eén account voor je verblijf, ontbijt op de kamer, Pottery House en wellness.':'Log in om je verblijf, bestellingen en abonnementen te bekijken.';
 $('#aB').textContent=m==='register'?'Account aanmaken':'Inloggen';$('#aS').innerHTML=m==='register'?'Al een account? <button type="button" data-m="login">Log in</button>':'Nog geen account? <button type="button" data-m="register">Maak er een</button>';$('#aE').textContent=''}
$('#aS').onclick=e=>{const b=e.target.closest('[data-m]');if(b)authMode(b.dataset.m)};
$('#aF').onsubmit=async e=>{e.preventDefault();const f=e.target;$('#aB').disabled=true;try{const r=await api(MODE==='register'?'g-register':'g-login',{name:f.name.value,email:f.email.value,phone:f.phone.value,password:f.password.value});T=r.token;try{localStorage.setItem('va_g_t',T)}catch(x){}start()}catch(x){$('#aE').textContent=x.message;if(x.status===409)authMode('login')}$('#aB').disabled=false};
function gInit(){fetch('/api/ops?a=g-config').then(r=>r.json()).then(c=>{if(!c.google)return;const go=()=>{google.accounts.id.initialize({client_id:c.google,callback:async res=>{try{const r=await api('g-google',{credential:res.credential});T=r.token;try{localStorage.setItem('va_g_t',T)}catch(x){}start()}catch(x){$('#aE').textContent=x.message}},ux_mode:'popup',auto_select:false});
 google.accounts.id.renderButton($('#gBtn'),{theme:'filled_black',shape:'pill',size:'large',text:'continue_with',locale:'nl',width:Math.min(380,$('#auth').clientWidth-44)});$('#gWrap').classList.remove('hide')};
 if(window.google&&google.accounts)go();else{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=1;sc.onload=go;document.head.appendChild(sc)}}).catch(()=>{})}
function showAuth(){gInit();$('#auth').classList.remove('hide');$('#shell').classList.add('hide');authMode('login')}
function logout(silent){T=null;try{localStorage.removeItem('va_g_t')}catch(e){}if(!silent)toast('Uitgelogd');showAuth()}

/* shell */
const TABS=[['home','Home','i-home'],['kalender','Kalender','i-cal'],['boekingen','Boekingen','i-list'],['account','Account','i-user']];
const SUB={leden:['Lidkaart & abonnementen','account'],ontdek:['In de buurt','home']};
async function start(){try{D=await api('g-me')}catch(e){return}
 $('#auth').classList.add('hide');$('#shell').classList.remove('hide');$('#av').textContent=(D.me.name||'?')[0].toUpperCase();
 $('#tabs').innerHTML=`<div class="sb-top"><img src="/img/logo_full.png" alt="Villa Amano" onerror="this.src='/img/logo_a.png'"><span class="caps">Mijn Villa Amano</span></div>`+TABS.map(t=>`<button data-t="${t[0]}"><svg><use href="#${t[2]}"/></svg>${t[1]}</button>`).join('')+`<div class="sb-me"><span class="av">${esc((D.me.name||'?')[0].toUpperCase())}</span><div><b>${esc(D.me.name)}</b><small>${esc(D.me.memberNo)}</small></div></div><a class="sb-web" href="/">← Naar de website</a>`;
 $('#tabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)};
 const h=location.hash.slice(1);go(h||'home');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/portaal/sw.js').catch(()=>{});maybeInstall()}
function go(t){if(!TABS.some(x=>x[0]===t)&&!SUB[t])t='home';TAB=t;history.replaceState(null,'',location.pathname+location.search+'#'+t);const par=SUB[t]?SUB[t][1]:t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===par));$('#title').textContent=SUB[t]?SUB[t][0]:TABS.find(x=>x[0]===t)[1];scrollTo(0,0);render();
 if(SUB[t]){const b=document.createElement('button');b.className='b2 back';b.textContent='← Terug';b.onclick=()=>go(SUB[t][1]);$('#app').prepend(b)}}
function render(){({home:vHome,kalender:vCal,boekingen:vBook,leden:vMem,ontdek:vDisc,account:vAcc})[TAB]()}
async function reload(){try{D=await api('g-me');render()}catch(e){}}
const KN=r=>r.kind==='room'?r.roomName:r.kind==='event'?r.title:r.kind==='wellness'?'Wellness-moment':r.kind==='lessen'?'Lessenreeks':'Vrij atelier';
const stLabel=s=>s==='geannuleerd'?'<span class="pill r">Geannuleerd</span>':'<span class="pill g">Bevestigd</span>';
const ordLabel=s=>({nieuw:'<span class="pill y">Ontvangen</span>',bereiding:'<span class="pill y">In bereiding</span>',geleverd:'<span class="pill g">Geleverd</span>',geannuleerd:'<span class="pill r">Geannuleerd</span>'})[s];

/* HOME */
function vHome(){const t=D.today,rs=D.reservations.filter(r=>r.status!=='geannuleerd');
 const stay=rs.filter(r=>r.kind==='room'&&r.to>=t).sort((a,b)=>a.from<b.from?-1:1)[0];
 const pot=rs.filter(r=>r.kind!=='room'&&r.date>=t).slice(0,3);
 const nw=new URLSearchParams(location.search).get('nieuw');const nr=nw&&D.reservations.find(r=>r.id===nw);
 const h=new Date().getHours(),hi=h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond';
 let x=`<div class="hello"><h1>${hi}, ${esc(D.me.name.split(' ')[0])}</h1></div>`;
 if(nr)x+=`<div class="ok"><svg><use href="#i-check"/></svg><div><b>Reservatie bevestigd</b><br><span style="color:var(--muted);font-size:13px">${nr.kind==='room'?esc(nr.roomName)+' · '+nice(nr.from)+' → '+nice(nr.to):(nr.kind==='lessen'?'Lessenreeks':'Vrij atelier')+' · '+nice(nr.date)} · ${fmt(nr.total)}</span></div></div>`;
 x+=`<div class="hg"><div class="hcol">`;
 if(!D.me.phone)x+=`<div class="ok" style="border-color:#e6b86666;background:#e6b86612;cursor:pointer" onclick="profileSheet()"><svg style="stroke:var(--gold)"><use href="#i-phone"/></svg><div><b>Voeg je telefoonnummer toe</b><br><span style="color:var(--muted);font-size:13px">Zo kunnen we je bereiken rond je verblijf.</span></div></div>`;
 if(stay){const r=R[stay.room],now=stay.from<=t&&stay.to>=t,dl=days(t,stay.from);
  x+=`<div class="stay" style="--t:${r[1]}"><div class="im" style="background-image:url('/img/${r[2]}.jpg')"><span class="badge">${now?'● Je verblijf loopt':dl===1?'Morgen aankomst':'Nog '+dl+' dagen'}</span></div><div class="bd">
  <span class="caps" style="color:${r[1]}">Kamer ${String(stay.roomNo).padStart(2,'0')}</span><h2>${esc(stay.roomName)}</h2><div class="dt">${nice(stay.from)} → ${nice(stay.to)} · ${stay.guests} gast${stay.guests>1?'en':''}</div>
  <div class="facts"><div><span>Check-in</span><b>15–21u</b></div><div><span>Check-out</span><b>${stay.extras&&stay.extras.late?'13u':'11u'}</b></div><div><span>Nachten</span><b>${stay.nights}</b></div></div>
  <div class="acts"><a class="cta" href="/ontbijt?kamer=${stay.roomNo}">Bestel ontbijt <svg><use href="#i-arrow"/></svg></a><button class="b2" onclick="needSheet()">Iets nodig?</button></div>
  <div class="inq" onclick="qrSheet('${stay.id}')"><div class="inq-q">${qrSvg(stay.qr)}</div><div class="inq-t"><span class="caps" style="color:${r[1]}">Je toegangscode</span><b>Toon bij aankomst aan de receptie</b><small>${stay.valid.ok?'● Geldig verblijf':stay.valid.why}</small><small class="k">${esc(stay.id)} · tik om te vergroten</small></div></div></div></div>
  <div class="hs ic2"><a href="${MAPS}" target="_blank" rel="noopener"><svg><use href="#i-pin"/></svg>Route</a><span><svg><use href="#i-park"/></svg>Gratis parking</span><span><svg><use href="#i-key"/></svg>Code op aankomstdag</span><span><svg><use href="#i-clock"/></svg>Ontbijt 7:30–10:30</span></div>`}
 else x+=`<div class="card hero0" style="text-align:center;padding:26px 18px"><h3 style="font-size:26px">Nog geen verblijf gepland</h3><p style="color:var(--muted);margin:6px 0 16px">Kies een kamer met de sfeer van een edelsteen.</p><a class="cta" href="/#kamers">Bekijk de kamers <svg><use href="#i-arrow"/></svg></a></div>`;
 if(pot.length)x+=`<div class="sec"><h3>Je reservaties</h3><button onclick="go('boekingen')">Alles →</button></div><div class="card">${pot.map(p=>`<div class="row" style="cursor:pointer" onclick="qrSheet('${p.id}')"><span class="ic"><svg><use href="#${p.kind==='event'?'i-cal':p.kind==='wellness'?'i-lotus':'i-vase'}"/></svg></span><div class="tx"><b>${esc(KN(p))}</b><small>${nice(p.date)}${p.time?' · '+esc(p.time.split(' ')[0]):''} · ${p.guests} pers.</small></div><div class="rt"><span class="qrt"><svg><use href="#i-qr"/></svg>QR</span></div></div>`).join('')}</div>`;
 const pact=Object.entries(D.me.memberships||{}).find(([k,m])=>m.status==='actief'&&/^pottery/.test(k));
 x+=`<div class="duo"><a class="mini" href="#kalender" onclick="event.preventDefault();bookSheet('pottery')"><span class="th" style="background-image:url('/img/pottery.jpg')"></span><span><b>Boek je volgende pottery-sessie</b><small>${pact?'Je abonnement is actief':'Vrij atelier of lessenreeks · tot 22u'}</small></span></a>

 if(ios&&!safari)body=st(1,'Open in Safari','Op iPhone kan dit alleen via Safari. Kopieer de link hieronder en plak hem in Safari.')+`<button class="b2" style="width:100%;margin:4px 0 14px" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/portaal/').then(()=>toast('Link gekopieerd'))">Kopieer link</button>`+st(2,'Volg daarna de stappen','Deel-icoon → Zet op beginscherm → Voeg toe.');
 else if(ios)body=st(1,'Tik op '+share+' Deel','Onderaan in Safari (of bovenaan op iPad).')+st(2,'Kies “Zet op beginscherm”','Scroll even naar beneden in het menu als je het niet meteen ziet.')+st(3,'Tik op “Voeg toe”','Villa Amano staat nu als app op je beginscherm.');
 else if(BIP)body=`<p style="color:#d6cab7;font-size:14px;margin:0 0 14px">Eén tik en Villa Amano staat als app op je toestel.</p>`;
 else body=st(1,'Tik op ⋮ rechtsboven','In Chrome (of het menu van je browser).')+st(2,'Kies “App installeren”','Of “Toevoegen aan startscherm”.')+st(3,'Bevestig met “Installeren”','Villa Amano staat nu als app op je beginscherm.');
 openSheet(`<span class="caps">${first?'Welkom bij Villa Amano':'App'}</span><h3 style="margin-top:6px">Zet Villa Amano op je telefoon</h3><div class="sub">Dan heb je je verblijf, ontbijt bestellen en je ledenkaart altijd bij de hand, in één tik.</div>${body}
 ${BIP&&!ios?'<button class="cta full" id="ibip">Installeer de app</button>':'<button class="cta full" onclick="closeSheet()">Begrepen</button>'}${first?'<button class="b2" style="width:100%;margin-top:8px;border:0;color:var(--muted)" onclick="closeSheet()">Later</button>':''}`);
 const b=$('#ibip');if(b)b.onclick=async()=>{BIP.prompt();const r=await BIP.userChoice;BIP=null;closeSheet();if(r.outcome!=='accepted')toast('Kan later via Account → Zet op beginscherm')};
 try{localStorage.setItem('va_inst_seen','1')}catch(e){}}
function maybeInstall(){if(STANDALONE())return;let seen=0;try{seen=localStorage.getItem('va_inst_seen')}catch(e){}if(seen)return;setTimeout(()=>installSheet(1),1400)}

/* QR */
function qrSvg(txt){if(!window.qrcode){if(!qrSvg._w){qrSvg._w=setInterval(()=>{if(window.qrcode){clearInterval(qrSvg._w);if(TAB==='home')render()}},150)}return '<div class="empty" style="padding:0;font-size:11px">QR…</div>'}const q=qrcode(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}
function qrSheet(id){const m=id==='M',r=m?null:D.reservations.find(x=>x.id===id);if(!m&&!r)return;
 const code=m?D.me.qr:r.qr,v=m?null:r.valid;
 const sub=m?`${esc(D.me.memberNo)} · ${esc(D.me.name)}`:r.kind==='room'?`Kamer ${String(r.roomNo).padStart(2,'0')} · ${nice(r.from)} → ${nice(r.to)} · ${r.guests} pers.`:`${nice(r.date)}${r.time?' · '+esc(r.time):''} · ${r.guests} pers.`;
 const st=m?'':v.ok?`<span class="pill g">● ${esc(v.why)}</span>`:v.early?`<span class="pill y">${esc(v.why.replace(/(\d{4})-(\d\d)-(\d\d)/,(a,y,mo,d)=>nice(a)))}</span>`:`<span class="pill r">${esc(v.why)}</span>`;
 openSheet(`<div class="qrw"><span class="caps">${m?'Ledenkaart':'Je toegangscode'}</span><h3 style="margin:6px 0 2px">${m?'Villa Amano Club':esc(KN(r))}</h3><div class="sub" style="margin-bottom:12px">${sub}</div>
 <div class="qrbox" id="qrb">${qrSvg(code)}</div><div class="k" style="margin:10px 0 6px;letter-spacing:.08em">${esc(m?D.me.memberNo:r.id)}</div>${st}
 ${!m&&r.lastScan?`<p class="k" style="text-transform:none;letter-spacing:0;margin:8px 0 0">Laatst gescand ${new Date(r.lastScan.t).toLocaleString('nl-BE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</p>`:''}
 <p class="k" style="text-transform:none;letter-spacing:0;margin:12px 0 14px">Toon deze code aan de receptie${m?'':' bij aankomst'}. Zet je scherm wat helderder.</p><button class="cta full" onclick="closeSheet()">Sluiten</button></div>`);
 if(!window.qrcode){const t=setInterval(()=>{if(window.qrcode){clearInterval(t);const b=$('#qrb');if(b)b.innerHTML=qrSvg(code)}},150)}}

/* sheet */
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('open');$('#sbg').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open');$('#sbg').classList.remove('open')}
$('#sbg').onclick=closeSheet;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T)reload()});
if(T)start();else{showAuth();if(location.hash==='#nieuw')authMode('register')}
</script>
</body>
</html>
